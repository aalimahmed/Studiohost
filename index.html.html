<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StudioLens — Offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --background:#F8F6F2; --foreground:#171717; --card:#FFFFFF;
    --secondary:#EDE9E3; --muted-fg:#746A63; --accent:#A66E59;
    --border:#D8D2CA; --danger:#8C3B2E; --success:#3F6B4E; --warning:#9C6B1F;
    --radius:6px;
  }
  body.dark{
    --background:#1B1B18; --foreground:#F4F2EB; --card:#23231F;
    --secondary:#2E2E29; --muted-fg:#ADA99F; --accent:#AF7C6A;
    --border:#3B3B35; --danger:#C97A6A; --success:#7FAE8E; --warning:#D1A24E;
  }
  /* ---- Extra theme variants ---- */
  body.mono{
    --background:#FFFFFF; --foreground:#0A0A0A; --card:#FFFFFF;
    --secondary:#EFEFEF; --muted-fg:#5C5C5C; --accent:#000000;
    --border:#D4D4D4; --danger:#000000; --success:#000000; --warning:#000000;
  }
  body.monodark{
    --background:#0A0A0A; --foreground:#FFFFFF; --card:#141414;
    --secondary:#232323; --muted-fg:#A3A3A3; --accent:#FFFFFF;
    --border:#333333; --danger:#FFFFFF; --success:#FFFFFF; --warning:#FFFFFF;
  }
  body.slate{
    --background:#EFF3F7; --foreground:#101828; --card:#FFFFFF;
    --secondary:#E1E8F0; --muted-fg:#5B6B85; --accent:#3B6EA5;
    --border:#CBD7E5; --danger:#B0433E; --success:#2F7D5F; --warning:#B0791E;
  }
  body.sage{
    --background:#F3F5EE; --foreground:#1E2A1B; --card:#FFFFFF;
    --secondary:#E4E9DA; --muted-fg:#5F6E52; --accent:#5C7A4A;
    --border:#D2DAC4; --danger:#A64B3C; --success:#4A7A4E; --warning:#A6791E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--background);color:var(--foreground);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-0.005em;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Fraunces','Playfair Display',Georgia,serif;font-weight:500;letter-spacing:-0.02em;margin:0;}
  .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
  a{color:inherit;}
  input,select,textarea{background:var(--secondary);border:1px solid var(--border);color:var(--foreground);border-radius:var(--radius);padding:10px 12px;font-size:14px;font-family:inherit;width:100%;}
  label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-fg);font-weight:600;display:block;margin-top:14px;margin-bottom:5px;}
  button{font-family:inherit;cursor:pointer;}

  /* ---- Shell / Sidebar ---- */
  .shell{min-height:100vh;}
  .sidebar{width:248px;background:var(--background);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;transition:transform .25s ease;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  @media(min-width:900px){.sidebar{transform:none !important;}}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;}
  @media(min-width:900px){.sidebar-overlay{display:none;}}
  .main{}
  @media(min-width:900px){.main{margin-left:248px;}}
  .sb-eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted-fg);}
  .sb-logo{font-size:26px;margin:4px 0 18px;}
  .sb-new-btn{background:var(--foreground);color:var(--background);border:none;border-radius:6px;padding:11px;font-weight:600;font-size:14px;width:100%;margin-bottom:16px;}
  .sb-nav{display:flex;flex-direction:column;gap:2px;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--muted-fg);font-size:14px;background:none;border:none;text-align:left;width:100%;}
  .sb-item .ic{width:18px;height:18px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;opacity:.85;}
  .sb-item .ic svg{width:16px;height:16px;}
  .sb-item.active{background:var(--secondary);color:var(--foreground);font-weight:600;}
  .sb-footer{border-top:1px solid var(--border);padding-top:14px;margin-top:16px;}
  .sb-footer .name{font-weight:600;font-size:14px;}
  .sb-footer .biz{font-size:12px;color:var(--muted-fg);}

  /* ---- Topbar ---- */
  .topbar2{position:sticky;top:0;z-index:20;background:var(--background);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:8px;}
  .tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .hamburger{display:flex;background:transparent;border:1px solid var(--border);border-radius:6px;width:34px;height:34px;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:var(--foreground);}
  @media(min-width:900px){.hamburger{display:none;}}
  .tb-titles{min-width:0;}
  .tb-eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-fg);}
  .tb-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .tb-btn-new{background:var(--foreground);color:var(--background);border:none;border-radius:6px;padding:9px 12px;font-weight:600;font-size:12px;white-space:nowrap;}
  .tb-icon{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .tb-lock{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;font-weight:600;background:transparent;color:var(--foreground);}

  .content2{padding:20px 18px 90px;}
  .page-title{font-size:26px;margin-top:4px;}
  .page-sub{color:var(--muted-fg);font-size:13px;margin-top:6px;}
  .page-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .page-head-row .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{border:none;border-radius:var(--radius);padding:10px 14px;font-weight:600;font-size:13px;}
  .btn-primary{background:var(--foreground);color:var(--background);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--foreground);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-block{width:100%;}

  /* ---- Hero ---- */
  .hero2{padding-top:2px;margin-bottom:26px;}
  .hero2 .heading{font-size:clamp(32px,8vw,50px);line-height:1.05;margin-top:10px;}
  .hero2 .heading .dim{color:var(--muted-fg);}
  .hero2 p{color:var(--muted-fg);font-size:14px;max-width:520px;margin-top:14px;}
  .hero-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

  /* ---- KPI divided row ---- */
  .kpi-row{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--border);padding-top:16px;}
  .kpi-cell{flex:1 1 46%;min-width:130px;padding:6px 16px 12px;border-right:1px solid var(--border);}
  .kpi-cell:nth-child(2n){border-right:none;}
  @media(min-width:640px){.kpi-cell{flex:1 1 auto;}.kpi-cell:nth-child(2n){border-right:1px solid var(--border);}.kpi-cell:last-child{border-right:none;}}
  .kpi-cell .kc-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-fg);font-weight:600;}
  .kpi-cell .kc-val{font-size:21px;margin-top:6px;}
  .kpi-cell .kc-val.accent{color:var(--accent);}
  .section-eyebrow-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin:26px 0 16px;flex-wrap:wrap;gap:8px;}
  .filter-tabs{display:flex;gap:14px;flex-wrap:wrap;}
  .filter-tab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg);background:none;border:none;font-weight:600;padding:0;}
  .filter-tab.active{color:var(--foreground);}

  /* ---- Status pill ---- */
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg);border:1px solid var(--border);border-radius:20px;padding:3px 9px;background:var(--secondary);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-fg);flex-shrink:0;}
  .status-pill.success{color:var(--success);} .status-pill.success .status-dot{background:var(--success);}
  .status-pill.warning{color:var(--warning);} .status-pill.warning .status-dot{background:var(--warning);}
  .status-pill.danger{color:var(--danger);} .status-pill.danger .status-dot{background:var(--danger);}

  /* ---- Colored status picker (custom dropdown) ---- */
  .status-picker{position:relative;display:inline-block;}
  .sp-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;background:none;white-space:nowrap;}
  .sp-chev{opacity:.6;font-size:9px;}
  .sp-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:170px;max-height:260px;overflow-y:auto;}
  .sp-opt{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;background:none;border:none;font-size:12px;font-weight:600;text-align:left;}
  .sp-opt:hover{background:var(--secondary);}

  /* ---- Theme swatches (Settings) ---- */
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:10px;}
  .theme-swatch{border:2px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;text-align:center;}
  .theme-swatch.active{border-color:var(--accent);}
  .theme-swatch .sw-preview{height:36px;border-radius:6px;margin-bottom:6px;border:1px solid rgba(0,0,0,.08);}
  .theme-swatch .sw-label{font-size:10px;font-weight:600;color:var(--foreground);}

  /* ---- List items (shoot cards on dashboard/upcoming) ---- */
  .shoot-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);}
  .shoot-row:last-child{border-bottom:none;}
  .date-badge{width:52px;flex-shrink:0;text-align:center;}
  .date-badge .mo{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-fg);}
  .date-badge .dd{font-size:22px;line-height:1;margin-top:2px;}
  .sr-title{font-size:16px;font-weight:500;}
  .sr-sub{font-size:12px;color:var(--muted-fg);margin-top:3px;}
  .sr-right{margin-left:auto;text-align:right;flex-shrink:0;}
  .sr-amt{font-size:13px;}

  /* ---- Cards / grids ---- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;}
  .studio-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:640px){.studio-grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:1100px){.studio-grid{grid-template-columns:1fr 1fr 1fr;}}
  .studio-card2{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;}
  .sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .sc-name{font-size:17px;}
  .sc-sub{font-size:12px;color:var(--muted-fg);margin-top:3px;}
  .sc-btns{display:flex;gap:8px;margin:14px 0;}
  .sc-btn{flex:1;background:var(--secondary);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;font-weight:600;text-align:center;color:var(--foreground);text-decoration:none;}
  .sc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .sc-stats.two{grid-template-columns:repeat(2,1fr);}
  .sc-stats .sl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg);}
  .sc-stats .sv{font-size:15px;margin-top:3px;}
  .sc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;}
  .link-arrow{font-weight:600;font-size:13px;background:none;border:none;color:var(--foreground);padding:0;}
  .icon-mini{background:none;border:none;color:var(--muted-fg);font-size:15px;padding:4px;}

  /* ---- Search / filter row ---- */
  .search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .search-row input{flex:2;min-width:160px;}
  .search-row select{flex:1;min-width:110px;}
  .totals-tag{text-align:right;}
  .totals-tag .tl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg);}
  .totals-tag .tv{font-size:20px;}

  /* ---- Table ---- */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--card);}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
  .data-table th{background:var(--secondary);text-align:left;padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg);white-space:nowrap;font-weight:600;}
  .data-table td{padding:12px;border-top:1px solid var(--border);white-space:nowrap;}
  .data-table td.wrap{white-space:normal;}
  .row-link{cursor:pointer;}
  .row-link:hover{background:var(--secondary);}
  .amt-neg{color:var(--danger);}
  .tbl-badge{background:var(--secondary);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10px;font-weight:600;text-transform:uppercase;}
  .icon-del{background:none;border:none;color:var(--muted-fg);font-size:15px;padding:4px;}

  /* ---- Pending payments card ---- */
  .pp-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;}
  .pp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .pp-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .pp-btn{background:var(--foreground);color:var(--background);border:none;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;text-decoration:none;}
  .pp-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--foreground);}

  /* ---- Calendar ---- */
  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.1em;padding-bottom:4px;}
  .day-cell{border:1px solid var(--border);border-radius:6px;min-height:52px;padding:5px;font-size:11px;background:var(--card);}
  .day-cell.today{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));}
  .day-cell .dn{font-size:12px;}
  .day-cell .dc{color:var(--accent);font-size:9px;margin-top:2px;}

  /* ---- Charts ---- */
  .chart-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:900px){.chart-grid{grid-template-columns:1fr 1fr;}}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;}
  .chart-card h3{font-size:15px;margin-bottom:12px;}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted-fg);flex-wrap:wrap;}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}

  /* ---- Empty state ---- */
  .empty2{text-align:center;padding:60px 20px;border:1px dashed var(--border);border-radius:8px;}
  .empty2 .ic-circle{width:52px;height:52px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;}
  .empty2 .et{font-weight:700;font-size:15px;}
  .empty2 .es{color:var(--muted-fg);font-size:13px;margin-top:6px;}

  /* ---- Modal / sheet ---- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .sheet{background:var(--background);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:20px;border:1px solid var(--border);position:relative;}
  @media(min-width:640px){.sheet{border-radius:10px;}}
  .sheet h3{font-size:19px;margin-bottom:2px;}
  .close-x{position:absolute;top:16px;right:16px;background:transparent;border:1px solid var(--border);width:32px;height:32px;border-radius:50%;color:var(--foreground);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-row label{margin-top:0;}

  /* ---- PIN ---- */
  .pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--background);}
  .pin-dots{display:flex;gap:14px;}
  .pin-dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--muted-fg);}
  .pin-dot.filled{background:var(--foreground);border-color:var(--foreground);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:16px;}
  .pin-key{width:64px;height:64px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--foreground);font-size:20px;font-family:'Fraunces',serif;}
  .link-a{color:var(--muted-fg);text-decoration:underline;font-size:12px;font-weight:500;background:none;border:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== DATA LAYER ===================== */
const DB_KEY='studioo_offline_v2';
function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayStr(){const d=new Date();return d.toISOString().slice(0,10);}
function defaultData(){
  return {
    meta:{pin:null, business_name:'', name:'', phone:'', whatsapp:'', email:'', address:'', gst_number:'', upi_id:'', bank_details:'', currency:'₹', theme:'light', firebaseConfig:'', syncCode:''},
    studios:[], shoots:[], payments:[], expenses:[]
  };
}
function load(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw) return defaultData();
    const d=JSON.parse(raw);
    return Object.assign(defaultData(), d, {meta:Object.assign(defaultData().meta, d.meta||{})});
  }catch(e){ return defaultData(); }
}
function save(fromRemote){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); if(!fromRemote) pushToCloud(); }
let DB=load();

/* ===================== CLOUD SYNC (Firebase) ===================== */
let fbDb=null, fbUnsub=null, syncEnabled=false, pushTimer=null, lastAppliedAt=0, syncStatus='';
function hasFirebaseSDK(){ return typeof firebase !== 'undefined'; }
function connectSync(){
  const cfgTxt=document.getElementById('f_fbconfig').value.trim();
  const code=document.getElementById('f_synccode').value.trim();
  if(!cfgTxt||!code){ alert('Please paste the Firebase config and enter a Sync Code.'); return; }
  DB.meta.firebaseConfig=cfgTxt; DB.meta.syncCode=code; localStorage.setItem(DB_KEY, JSON.stringify(DB));
  initSync(false);
}
function disconnectSync(){
  if(fbUnsub){ try{fbUnsub();}catch(e){} fbUnsub=null; }
  syncEnabled=false; syncStatus=''; render();
}
function initSync(silent){
  if(!hasFirebaseSDK()){ syncStatus='no-internet'; if(!silent) alert('Could not reach Firebase — check your internet connection and try again.'); render(); return; }
  const cfgTxt=DB.meta.firebaseConfig, code=DB.meta.syncCode;
  if(!cfgTxt||!code){ return; }
  try{
    const cfg=JSON.parse(cfgTxt);
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(cfg); }
    fbDb=firebase.firestore();
    if(fbUnsub){ try{fbUnsub();}catch(e){} }
    fbUnsub=fbDb.collection('studiolens_sync').doc(code).onSnapshot(function(docSnap){
      if(docSnap && docSnap.exists){
        const remote=docSnap.data();
        if(remote && remote.updated_at && remote.updated_at>lastAppliedAt){
          lastAppliedAt=remote.updated_at;
          const keepCfg=DB.meta.firebaseConfig, keepCode=DB.meta.syncCode;
          DB=Object.assign(defaultData(), remote.payload, {meta:Object.assign(defaultData().meta, (remote.payload&&remote.payload.meta)||{}, {firebaseConfig:keepCfg, syncCode:keepCode})});
          save(true);
          syncEnabled=true; syncStatus='connected';
          render();
        }
      }
    }, function(err){ syncStatus='error'; render(); });
    syncEnabled=true; syncStatus='connected';
    if(!silent) alert('Cloud sync connected! Open this same app with the same Sync Code on your other device to sync.');
    render();
  }catch(e){
    syncEnabled=false; syncStatus='error';
    if(!silent) alert('That Firebase config looks invalid. Please copy it again from Firebase Console and try.');
    render();
  }
}
function pushToCloud(){
  if(!syncEnabled || !fbDb) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    const ts=Date.now();
    lastAppliedAt=ts;

/* ===================== HELPERS ===================== */
function money(n){ n=Number(n)||0; return DB.meta.currency + n.toLocaleString('en-IN',{maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); if(!y) return s; const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${parseInt(d)} ${MO[parseInt(m)-1]} ${y}`; }
function monthAbbr(s){ if(!s) return ''; const MO=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']; const [y,m]=s.split('-'); return MO[parseInt(m)-1]; }
function dayNum(s){ if(!s) return ''; return String(parseInt(s.split('-')[2])); }
function daysUntil(s){ const t=new Date(todayStr()); const d=new Date(s); return Math.round((d-t)/86400000); }
function studioName(id){ const s=DB.studios.find(x=>x.id===id); return s? s.studio_name : '—'; }
function studio(id){ return DB.studios.find(x=>x.id===id); }
function shoot(id){ return DB.shoots.find(x=>x.id===id); }
function esc(s){ return (s===undefined||s===null)?'':String(s); }
function waLink(mobile,msg){ return `https://wa.me/${(mobile||'').replace(/[^0-9]/g,'')}${msg?'?text='+encodeURIComponent(msg):''}`; }

function shootReceived(shootId){ return DB.payments.filter(p=>p.shoot_id===shootId).reduce((a,p)=>a+Number(p.amount||0),0); }
function shootExpenses(shootId){ return DB.expenses.filter(e=>e.related_shoot_id===shootId).reduce((a,e)=>a+Number(e.amount||0),0); }
function studioStats(studioId){
  const shoots=DB.shoots.filter(s=>s.studio_id===studioId);
  const billing=shoots.reduce((a,s)=>a+Number(s.agreed_amount||0),0);
  const received=DB.payments.filter(p=>p.studio_id===studioId).reduce((a,p)=>a+Number(p.amount||0),0);
  const expenses=DB.expenses.filter(e=>e.related_studio_id===studioId).reduce((a,e)=>a+Number(e.amount||0),0);
  return { total_shoots:shoots.length, total_billing:billing, total_received:received, total_pending:billing-received, total_expenses:expenses, net_profit:received-expenses };
}
function periodRange(period){
  const now=new Date(); let start;
  if(period==='today'){ start=todayStr(); return {start, end:todayStr()}; }
  if(period==='week'){ const d=new Date(now); d.setDate(d.getDate()-7); start=d.toISOString().slice(0,10); }
  else if(period==='month'){ start=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01'; }
  else if(period==='year'){ start=now.getFullYear()+'-01-01'; }
  else { start='0000-01-01'; }
  return {start, end:'9999-12-31'};
}
function inPeriod(dateStr, period){ const {start,end}=periodRange(period); return dateStr>=start && dateStr<=end; }
function globalStats(period){
  period=period||'all';
  const income=DB.payments.filter(p=>inPeriod(p.payment_date,period)).reduce((a,p)=>a+Number(p.amount||0),0);
  const advance=DB.payments.filter(p=>inPeriod(p.payment_date,period)&&p.payment_type==='Advance').reduce((a,p)=>a+Number(p.amount||0),0);
  const expenses=DB.expenses.filter(e=>inPeriod(e.expense_date,period)).reduce((a,e)=>a+Number(e.amount||0),0);
  const billing=DB.shoots.reduce((a,s)=>a+Number(s.agreed_amount||0),0);
  const totalReceived=DB.payments.reduce((a,p)=>a+Number(p.amount||0),0);
  const pending=billing-totalReceived;
  const upcoming=DB.shoots.filter(s=>s.shoot_date>=todayStr() && s.status!=='Cancelled').length;
  const completed=DB.shoots.filter(s=>s.status==='Completed').length;
  const active=DB.shoots.filter(s=>s.status!=='Cancelled').length;
  return {income, expenses, net_profit:income-expenses, pending, advance, upcoming, completed, active};
}

/* ===================== CALENDAR ===================== */
let CAL_MONTH=new Date().getMonth(), CAL_YEAR=new Date().getFullYear();
function renderCalendar(){
  const first=new Date(CAL_YEAR,CAL_MONTH,1); const startDow=first.getDay();
  const daysInMonth=new Date(CAL_YEAR,CAL_MONTH+1,0).getDate();
  const monthName=first.toLocaleString('en-US',{month:'long',year:'numeric'});
  const byDay={};
  DB.shoots.forEach(s=>{ const d=s.shoot_date; if(!d)return; const dt=new Date(d); if(dt.getFullYear()===CAL_YEAR && dt.getMonth()===CAL_MONTH){ byDay[dt.getDate()]=(byDay[dt.getDate()]||0)+1; } });
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday = todayStr()===`${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=`<div class="day-cell ${isToday?'today':''}"><div class="dn">${d}</div>${byDay[d]?`<div class="dc">●${byDay[d]} shoot${byDay[d]>1?'s':''}</div>`:''}</div>`;
  }
  const dayLabels=['S','M','T','W','T','F','S'];
  return `
  <div class="page-head-row">
    <div><div class="page-title">Shoots Calendar</div><div class="page-sub">Full month view — spot conflicts before they happen.</div></div>
    <button class="btn btn-primary" onclick="openForm('shoot')">+ Book Shoot</button>
  </div>
  <div class="card">
    <div class="cal-nav">
      <button class="tb-icon" onclick="calMove(-1)">←</button>
      <h3 style="font-size:20px;">${monthName}</h3>
      <button class="tb-icon" onclick="calMove(1)">→</button>
    </div>
    <div class="cal-grid" style="margin-bottom:6px;">${dayLabels.map(l=>`<div class="cal-dow">${l}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>
  <div class="section-eyebrow-row"><div class="tb-eyebrow">Shoots this month</div></div>
  ${DB.shoots.filter(s=>{const dt=new Date(s.shoot_date);return dt.getFullYear()===CAL_YEAR&&dt.getMonth()===CAL_MONTH;}).sort((a,b)=>a.shoot_date.localeCompare(b.shoot_date)).map(s=>dashShootRow(s)).join('') || emptyState('📅','No shoots this month','')}
  `;
}
function calMove(n){ CAL_MONTH+=n; if(CAL_MONTH<0){CAL_MONTH=11;CAL_YEAR--;} if(CAL_MONTH>11){CAL_MONTH=0;CAL_YEAR++;} render(); }

  const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1); const tmr=tomorrow.toISOString().slice(0,10);
  const in7=new Date(); in7.setDate(in7.getDate()+7); const d7=in7.toISOString().slice(0,10);

function renderFinancials(){

  const billing=shoots.reduce((a,s)=>a+Number(s.agreed_amount||0),0);
  const received=DB.payments.filter(p=>studioIds.has(p.studio_id)).reduce((a,p)=>a+Number(p.amount||0),0);
  const expenses=DB.expenses.filter(e=>!e.related_studio_id||studioIds.has(e.related_studio_id)).reduce((a,e)=>a+Number(e.amount||0),0);

  const byMonth={};
  shoots.forEach(s=>{ const m=(s.shoot_date||'').slice(0,7); if(!m)return; byMonth[m]=byMonth[m]||{income:0,expenses:0}; byMonth[m].income+=Number(s.agreed_amount||0); });
  DB.expenses.forEach(e=>{ const m=(e.expense_date||'').slice(0,7); if(!m)return; byMonth[m]=byMonth[m]||{income:0,expenses:0}; byMonth[m].expenses+=Number(e.amount||0); });
  const months=Object.keys(byMonth).sort();
  const maxVal=Math.max(1,...months.map(m=>Math.max(byMonth[m].income,byMonth[m].expenses)));

  const studioRev={};
  DB.shoots.forEach(s=>{ studioRev[s.studio_id]=(studioRev[s.studio_id]||0)+Number(s.agreed_amount||0); });
  const studioRows=Object.keys(studioRev).map(id=>({name:studioName(id),val:studioRev[id]})).sort((a,b)=>b.val-a.val).slice(0,6);
  const maxStudio=Math.max(1,...studioRows.map(r=>r.val));

  const catTotals={};
  DB.expenses.forEach(e=>{ catTotals[e.category]=(catTotals[e.category]||0)+Number(e.amount||0); });
  const catRows=Object.keys(catTotals).map((k,i)=>({name:k,val:catTotals[k],color:PIE_COLORS[i%PIE_COLORS.length]})).sort((a,b)=>b.val-a.val).slice(0,8);
  const catTotal=catRows.reduce((a,r)=>a+r.val,0)||1;

  return `
  <div class="page-title">Financial Analytics</div>

  <div class="search-row">

function yearlyChart(){
  const byYear={};
  DB.shoots.forEach(s=>{ const y=(s.shoot_date||'').slice(0,4); if(!y)return; byYear[y]=byYear[y]||{billing:0,received:0}; byYear[y].billing+=Number(s.agreed_amount||0); });
  DB.payments.forEach(p=>{ const y=(p.payment_date||'').slice(0,4); if(!y)return; byYear[y]=byYear[y]||{billing:0,received:0}; byYear[y].received+=Number(p.amount||0); });
  const years=Object.keys(byYear).sort();
  if(!years.length) return `<div style="color:var(--muted-fg);font-size:13px;">No data yet</div>`;
  const maxVal=Math.max(1,...years.map(y=>Math.max(byYear[y].received, Math.max(0,byYear[y].billing-byYear[y].received))));
  const w=320,bw=Math.min(38,(w/years.length)/2-6);
  let bars='';
  years.forEach((y,i)=>{
    const groupX=i*(w/years.length)+16;
    const received=byYear[y].received, pending=Math.max(0,byYear[y].billing-byYear[y].received);
    const rH=(received/maxVal)*110, pH=(pending/maxVal)*110;
    bars+=`<rect x="${groupX}" y="${130-rH}" width="${bw}" height="${rH}" fill="#16A34A" rx="2"></rect>`;
    bars+=`<rect x="${groupX+bw+4}" y="${130-pH}" width="${bw}" height="${pH}" fill="#DC2626" rx="2"></rect>`;
    bars+=`<text x="${groupX+bw}" y="146" font-size="10" fill="var(--muted-fg)" text-anchor="middle">${y}</text>`;
  });
  const table=`<div class="table-wrap" style="margin-top:14px;"><table class="data-table"><tr><th>Year</th><th>Income</th><th>Pending</th></tr>
  ${years.map(y=>`<tr><td>${y}</td><td class="num" style="color:#16A34A;">${money(byYear[y].received)}</td><td class="num" style="color:#DC2626;">${money(Math.max(0,byYear[y].billing-byYear[y].received))}</td></tr>`).join('')}
  </table></div>`;
  return `<svg viewBox="0 0 ${w} 160" style="width:100%;height:170px;"><line x1="0" y1="130" x2="${w}" y2="130" stroke="var(--border)"/>${bars}</svg>${table}`;
}
function barChart(months,byMonth,maxVal){
  if(!months.length) return `<div class="muted" style="color:var(--muted-fg);font-size:13px;">No data yet</div>`;
  const w=280,h=140,bw=Math.min(30,(w/months.length)/2-4);
  let bars='';
  months.forEach((m,i)=>{
    const groupX=i*(w/months.length)+10;
    const inc=byMonth[m].income, exp=byMonth[m].expenses;
    const incH=(inc/maxVal)*100, expH=(exp/maxVal)*100;
    bars+=`<rect x="${groupX}" y="${110-incH}" width="${bw}" height="${incH}" fill="var(--foreground)"></rect>`;
    bars+=`<rect x="${groupX+bw+3}" y="${110-expH}" width="${bw}" height="${expH}" fill="var(--accent)"></rect>`;
    bars+=`<text x="${groupX+bw}" y="128" font-size="8" fill="var(--muted-fg)" text-anchor="middle">${m.slice(2)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} 140" style="width:100%;height:150px;"><line x1="0" y1="110" x2="${w}" y2="110" stroke="var(--border)"/>${bars}</svg>`;
}
function lineDots(months,byMonth){
  if(!months.length) return `<div style="color:var(--muted-fg);font-size:13px;">No data yet</div>`;
  const w=280,h=140;
  const profits=months.map(m=>byMonth[m].income-byMonth[m].expenses);
  const maxP=Math.max(1,...profits.map(Math.abs));
  let pts='',dots='';
  months.forEach((m,i)=>{
    const x=10+i*((w-20)/Math.max(1,months.length-1||1));
    const y=60-(profits[i]/maxP)*50;
    pts+=(i===0?'M':'L')+x+','+y+' ';
    dots+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"></circle>`;
  });
  return `<svg viewBox="0 0 ${w} 100" style="width:100%;height:110px;"><line x1="0" y1="60" x2="${w}" y2="60" stroke="var(--border)"/><path d="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${dots}</svg>`;
}
function hBarChart(rows,maxVal,colors){
  if(!rows.length) return `<div style="color:var(--muted-fg);font-size:13px;">No data yet</div>`;
  return rows.map((r,i)=>`
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>${esc(r.name)}</span><span class="num">${money(r.val)}</span></div>
      <div style="background:var(--secondary);border-radius:4px;height:8px;overflow:hidden;"><div style="width:${Math.max(3,(r.val/maxVal)*100)}%;height:100%;background:${colors?colors[i]:'var(--foreground)'};"></div></div>
    </div>`).join('');
}

function exportCSV(){
  let rows=[['Type','Date','Studio','Description','Category/Type','Amount']];
  DB.shoots.forEach(s=>rows.push(['Shoot',s.shoot_date,studioName(s.studio_id),s.event_name,s.status,s.agreed_amount]));
  DB.payments.forEach(p=>rows.push(['Payment',p.payment_date,studioName(p.studio_id),p.reference_no||'',p.payment_type,p.amount]));
  DB.expenses.forEach(e=>rows.push(['Expense',e.expense_date,e.related_studio_id?studioName(e.related_studio_id):'',e.description,e.category,-e.amount]));
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='studiolens-report-'+todayStr()+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

function exportData(){

function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{ const d=JSON.parse(e.target.result); DB=Object.assign(defaultData(),d,{meta:Object.assign(defaultData().meta,d.meta||{})}); save(); alert('Import successful'); render(); }
    catch(err){ alert('Invalid backup file'); }
  };
  reader.readAsText(file);
}

  if(ftype==='status_select'){
    const cur=val||SHOOT_STATUSES[0];
    return `<label>${label}${req?' *':''}</label><select id="ff_${key}" style="color:${statusColor(cur)};font-weight:700;" onchange="this.style.color=statusColor(this.value)">${statusOptionsHTML(cur)}</select>`;
  }
  if(ftype.startsWith('select:')){
    const opts=ftype.split(':')[1].split(',');
    return `<label>${label}${req?' *':''}</label><select id="ff_${key}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  return `<label>${label}${req?' *':''}</label><input id="ff_${key}" type="${ftype}" value="${esc(val)}">`;
}
function submitForm(type, editId){
  const fields=fieldsFor(type);
  const obj={};
  for(const [key,label,ftype,req] of fields){
    const el=document.getElementById('ff_'+key);
    let v=el.value;
    if(ftype==='number') v=v===''?0:Number(v);
    if(req && (v===''||v===undefined||v===null)){ alert(label+' is required'); return; }
    obj[key]=v;
  }
  const coll=type+'s';
  if(editId){
    const idx=DB[coll].findIndex(x=>x.id===editId);
    DB[coll][idx]=Object.assign(DB[coll][idx],obj,{updated_at:new Date().toISOString()});
  } else {
    obj.id=uid(); obj.created_at=new Date().toISOString();
    DB[coll].push(obj);
  }
  save();
  STATE.modal=null;
  render();
}

/* ===================== INIT ===================== */
render();
if(DB.meta.firebaseConfig && DB.meta.syncCode){ setTimeout(function(){ initSync(true); }, 300); }
document.addEventListener('click', function(){ if(STATE.openPicker){ STATE.openPicker=null; render(); } });
</script>
</body>
